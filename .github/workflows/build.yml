name: Build SBK for Windows

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Generate logo and sounds
        shell: bash
        run: |
          pip install pillow numpy
          mkdir -p build
          curl -sL -o build/Poppins-Bold.ttf https://github.com/google/fonts/raw/main/ofl/poppins/Poppins-Bold.ttf
          python gen_assets.py
      - run: npm install --no-audit --no-fund
      - run: npm run dist
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
      - uses: actions/upload-artifact@v4
        with:
          name: SBK-Windows
          path: |
            dist/SBK-Setup.exe
            dist/SBK-Portable.exe
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: SBK v1.0.${{ github.run_number }}
          make_latest: true
          body: |
            ⚡ **SBK app for Windows**
            - **SBK-Setup.exe**: installs SBK with a desktop shortcut (recommended)
            - **SBK-Portable.exe**: runs without installing
            Windows may say "Windows protected your PC". Click **More info → Run anyway** (the app isn't signed yet).
          files: |
            dist/SBK-Setup.exe
            dist/SBK-Portable.exe
